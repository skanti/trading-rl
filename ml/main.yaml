defaults:
  - _self_
general:
  experiment_name: "train-cls-rel-weekday-3d"
  experiment_dir: "${oc.env:EXP_DIR}/trading/${general.experiment_name}"
  # Selects the supervised classifier over the PPO trading policies.
  task: "classification"
model:
  device: "cuda:0"
  lr: 3e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  eta_min: 1e-6
  mlp:
    window_size: 9600
    # One anchored log(stock/reference) path; neither raw path is exposed.
    feature_dim: 1
    # The narrower projection keeps the 9,600-point model near 1.3M parameters.
    hidden_dim: 128
    depth: 4
    # Anchor progress plus a five-way Monday--Friday one-hot encoding.
    scalar_dim: 6
data:
  reference_symbol: "ST-SPY"
  tick_minutes: 1
  context_days: 10
  # 10 extended sessions x 960 one-minute observations, ending at the anchor.
  window_size: 9600
  # Trading sessions ahead, evaluated at the same time of day.
  horizon_days: 3
  anno: "2010-01-01"
  days_path: "${oc.env:DATA_DIR}/ppv1/updates/full_2026-08-22_10d.csv"
  data_dir: "${oc.env:DATA_DIR}/ppv1/updates/full_2026-08-22"
  validation_weeks: 4
  date_val: "2026-07-25"
  price_feature_scale: 100.0
  # Validation is pinned to the 50 most-traded stocks so its win rate is stable
  # across steps.
  val_universe:
    path: "../data/tickers_all.txt"
    size: 50
train:
  batch_size: 64
  steps_num: 50000
  workers_num: 16
  split: "train"
  # A fresh regular-session time is drawn per visit during training.
  should_augment: true
  seed: 0
val:
  batch_size: 64
  workers_num: 4
  split: "val"
  should_augment: false
  # One full deterministic pass over the pinned validation universe.
  validation_batches: null
loop:
  log_interval: 50
  validation_interval: 500
  checkpoint_interval: 500
