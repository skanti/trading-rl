defaults:
  - _self_
general:
  experiment_name: "train-rl-mlp-10d-3action-real-spy-reference"
  experiment_dir: "${oc.env:EXP_DIR}/trading/${general.experiment_name}"
model:
  pretrained_path: null
  device: "cuda:0"
  lr: 3e-4
  gamma: 0.99
  gae_lambda: 0.95
  transaction_cost: 1e-4
  # Penalizes inventory variance so the policy can prefer staying flat.
  risk_penalty: 1e-6
  ppo_clip: 0.2
  ppo_value_clip: 0.2
  max_grad_norm: 1.0
  actor:
    window_size: ${data.window_size}
    feature_dim: 8
    hidden_dim: 256
    depth: 4
    action_dim: 3
  critic:
    window_size: ${model.actor.window_size}
    feature_dim: ${model.actor.feature_dim}
    hidden_dim: ${model.actor.hidden_dim}
    depth: ${model.actor.depth}
  loss_weights:
    policy: 1.0
    value: 0.5
    entropy: 0.001
data:
  use_toy: false
  reference_symbol: "ST-SPY"
  context_days: 10
  window_size: 9601
  rollout_size: 390
  require_full_session: true
  price_feature_scale: 100.0
  anno: "2010-01-01"
  days_path: "${oc.env:DATA_DIR}/ppv1/updates/full_2026-08-22_top500_days_10d.csv"
  data_dir: "${oc.env:DATA_DIR}/ppv1/updates/full_2026-08-22"
  # The dataset ends 2026-08-21, so 2026-07-25 begins its trailing four weeks.
  validation_weeks: 4
  date_val: "2026-07-25"
  enforce_market_hours: true
train:
  batch_size: 8
  steps_num: 50000
  ppo_epochs: 4
  workers_num: 4
  split: "train"
  should_augment: true
  seed: 0
val:
  batch_size: 4
  workers_num: 2
  split: "val"
  should_augment: false
  validation_batches: 4
loop:
  log_interval: 20
  validation_interval: 500
  checkpoint_interval: 500
