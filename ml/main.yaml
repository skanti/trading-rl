defaults:
  - _self_
general:
  experiment_name: "train-rl-llama"
  experiment_dir: "${oc.env:EXP_DIR}/trading/${general.experiment_name}"
model:
  pretrained_path: null
  device: "cuda:0"
  method: "rl"
  lr: 1e-3
  batch_size: 8
  gamma: 0.95
  seq_size: 4096
  ctx_size: 2
  channels: 2
  vocab_size: 4096
  transaction_cost: 0.0
  ppo_clip: 0.1
  ppo_value_clip: 0.1
  max_grad_norm: 1.0
  transformer:
    batch_size: 8
    block_size: 8194
    vocab_size: ${model.vocab_size}
    n_layer: 4
    n_head: 8
    dim: 256
  actor:
    transformer: ${model.transformer}
  critic:
    transformer: ${model.transformer}
  # loss
  loss_weights:
    policy: 1.0
    value: 1.0
    entropy: 0.01
data:
  seq_size: ${model.seq_size}
  ctx_size: ${model.ctx_size}
  channels: ${model.channels}
  rollout_size: 16
  vocab_size: ${model.vocab_size}
  anno: "2010-01-01"
  mapping_path: "${oc.env:DATA_DIR}/ppv1/ppv1_2025-07-20_mapping.txt"
  days_path: "${oc.env:DATA_DIR}/ppv1/ppv1_2025-10-04_days.csv"
  data_dir: "${oc.env:DATA_DIR}/ppv1/ppv1_2025-10-04"
  date_val: "2025-09-29"
  enforce_market_hours: true
train:
  batch_size: ${model.batch_size}
  steps_num: 5e4
  ppo_epochs: 4
  workers_num: 8
  split: "train"
  should_augment: true
val:
  batch_size: ${model.batch_size}
  workers_num: 0
  split: "val"
  should_augment: false
loop:
  # logger
  log_interval: 20
  save_interval: 100
  checkpoint_interval: 5000
