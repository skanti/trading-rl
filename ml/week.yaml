defaults:
  - _self_
general:
  experiment_name: "train-rl-mlp-week-10min"
  experiment_dir: "${oc.env:EXP_DIR}/trading/${general.experiment_name}"
model:
  architecture: "mlp"
  pretrained_path: null
  device: "cuda:0"
  lr: 3e-4
  weight_decay: 0.01
  # One step is now ten minutes, so the same 0.99 would discount Friday to
  # nothing from Monday. 0.999 keeps a full week roughly undiscounted.
  gamma: 0.999
  gae_lambda: 0.95
  transaction_cost: 1e-4
  # Penalizes inventory variance so the policy can prefer staying flat.
  risk_penalty: 1e-6
  ppo_clip: 0.2
  ppo_value_clip: 0.2
  max_grad_norm: 1.0
  # Shifted-window policy over ten days of 10-minute bars.
  mlp:
    window_size: 960
    feature_dim: 8
    hidden_dim: 512
    depth: 4
    action_dim: 3
    scalar_dim: 4
  loss_weights:
    policy: 1.0
    value: 0.5
    entropy: 0.01
data:
  use_toy: false
  reference_symbol: "ST-SPY"
  tick_minutes: 10
  context_days: 10
  # 10 extended sessions x 96 ten-minute bars.
  context_ticks: 960
  # 5 sessions x 40 grid points (09:30..16:00 inclusive), minus the final
  # Friday 16:00 tick, which prices the last interval and liquidates.
  rollout_size: 199
  anno: "2010-01-01"
  days_path: "${oc.env:DATA_DIR}/ppv1/updates/full_2026-08-22_10d.csv"
  data_dir: "${oc.env:DATA_DIR}/ppv1/updates/full_2026-08-22"
  # The dataset ends Friday 2026-08-21, so 2026-07-25 begins its trailing four
  # calendar weeks and the first validation week starts Monday 2026-07-27.
  validation_weeks: 4
  date_val: "2026-07-25"
  enforce_market_hours: true
  price_feature_scale: 100.0
train:
  batch_size: 64
  steps_num: 50000
  ppo_epochs: 4
  workers_num: 2
  split: "train"
  should_augment: true
  seed: 0
val:
  batch_size: 8
  workers_num: 1
  split: "val"
  should_augment: false
  validation_batches: 10
loop:
  log_interval: 20
  validation_interval: 500
  checkpoint_interval: 500
